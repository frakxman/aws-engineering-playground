<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        AWS
      </div>

      <div class="brand-copy">
        <span class="brand-title">AWS</span>
        <span class="brand-subtitle">Engineering Playground</span>
      </div>
    </div>

    <nav class="sidebar-nav" aria-label="Main navigation">
      <div class="nav-section">
        <span class="nav-label">PLAYGROUND</span>

        <a
          class="nav-item"
          routerLink="/overview"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span class="nav-icon">⌂</span>
          <span>Overview</span>
        </a>

        <a
          class="nav-item"
          routerLink="/services"
          routerLinkActive="active"
        >
          <span class="nav-icon">▣</span>
          <span>Services</span>
        </a>
        
        <a class="nav-item" href="#">
          <span class="nav-icon">◇</span>
          <span>Architecture</span>
        </a>

        <a class="nav-item" href="#">
          <span class="nav-icon">&lt;/&gt;</span>
          <span>Labs</span>
        </a>
      </div>

      <div class="nav-section">
        <span class="nav-label">ENGINEERING</span>

        <a class="nav-item" href="#">
          <span class="nav-icon">◆</span>
          <span>Patterns</span>
        </a>

        <a class="nav-item" href="#">
          <span class="nav-icon">↗</span>
          <span>References</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <span class="status-dot"></span>
      <span>AWS Playground</span>
      <span class="version">v0.1</span>
    </div>
  </aside>

  <div class="app-content">
    <header class="topbar">
      <div class="breadcrumb">
        <span class="breadcrumb-muted">AWS</span>
        <span>/</span>
        <span>Overview</span>
      </div>

      <div class="topbar-actions">
        <button
          class="topbar-button"
          type="button"
          aria-label="Open command palette"
        >
          <span>⌘</span>
          <span>K</span>
        </button>

        <button
          class="topbar-button icon-button"
          type="button"
          aria-label="Toggle theme"
        >
          ◐
        </button>
      </div>
    </header>

    <router-outlet />
  </div>
</div>
